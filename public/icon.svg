<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle border outline -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.35" />

  <!-- Viewfinder corners -->
  <path d="M 100 160 L 100 120 L 140 120" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 412 160 L 412 120 L 372 120" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 100 352 L 100 392 L 140 392" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 412 352 L 412 392 L 372 392" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Camera Body Center -->
  <rect x="140" y="160" width="232" height="192" rx="36" fill="url(#lensGrad)" stroke="url(#glowGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Camera Top Flash Notch -->
  <rect x="216" y="132" width="80" height="28" rx="10" fill="#34d399" opacity="0.9" />

  <!-- Center Lens Ring -->
  <circle cx="256" cy="256" r="64" fill="#022c22" stroke="url(#glowGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="42" fill="#047857" opacity="0.4" />

  <!-- Translation Symbol in Lens Center -->
  <!-- "A" Latin -->
  <text x="238" y="266" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">A</text>
  <!-- Asian Character 文 -->
  <text x="274" y="268" font-family="Arial, 'PingFang SC', sans-serif" font-weight="900" font-size="28" fill="#34d399" text-anchor="middle">文</text>

  <!-- Live Pulse Dot -->
  <circle cx="340" cy="190" r="10" fill="#ef4444" />
</svg>
